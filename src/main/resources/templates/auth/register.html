<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Регистрация</title></head>
<body>
<h2>Регистрация</h2>
<form action="#" th:action="@{/auth/register}" method="post" th:object="${signUpRequest}">
    <input type="text" th:field="*{username}" placeholder="Имя"/><br>
    <input type="email" th:field="*{email}" placeholder="Email"/><br>
    <input type="password" th:field="*{password}" placeholder="Пароль"/><br>

    <select th:field="*{role}">
        <option value="USER">USER</option>
        <option value="ADMIN">ADMIN</option>
    </select><br>

    <button type="submit">Зарегистрироваться</button>
</form>

<div th:if="${error}" th:text="${error}" style="color:red;"></div>

<p th:if="${error}" th:text="${error}"></p>
<a href="/auth/login">Уже есть аккаунт?</a>
</body>
</html>
